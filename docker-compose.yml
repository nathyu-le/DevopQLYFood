services:
  app:
    image: ${APP_IMAGE:-devopqlyfood:local}
    build:
      context: .
      args:
        APP_REVISION: ${APP_REVISION:-local}
    restart: unless-stopped
    init: true
    mem_limit: 256m
    cpus: 1.0
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-restaurant_menu}
      DB_USER: ${DB_USER:-menu_app}
      DB_PASSWORD_FILE: /run/secrets/db_password
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD_FILE: /run/secrets/admin_password
    secrets: [db_password, admin_password]
    volumes:
      - operations_data:/var/www/html/var
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:80"
    depends_on:
      db:
        condition: service_healthy
    networks: [menu]

  db:
    image: mariadb:10.11
    restart: unless-stopped
    mem_limit: 512m
    environment:
      MARIADB_DATABASE: ${DB_NAME:-restaurant_menu}
      MARIADB_USER: ${DB_USER:-menu_app}
      MARIADB_PASSWORD_FILE: /run/secrets/db_password
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
    secrets: [db_password, db_root_password]
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
      - ./docker/20-app-grants.sh:/docker-entrypoint-initdb.d/20-app-grants.sh:ro
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks: [menu]

networks:
  menu:

volumes:
  db_data:
  operations_data:

secrets:
  db_password:
    file: ./.secrets/db_password
  db_root_password:
    file: ./.secrets/db_root_password
  admin_password:
    file: ./.secrets/admin_password
