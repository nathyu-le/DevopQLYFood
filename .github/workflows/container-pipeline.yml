name: Week 2 - Docker checks and cPanel deploy

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'evidence/**', '*.md', 'architecture.png']
  pull_request:
    paths-ignore: ['docs/**', 'evidence/**', '*.md', 'architecture.png']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: containers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  container-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: devopqlyfood_ci
      APP_IMAGE: devopqlyfood:${{ github.sha }}
      APP_REVISION: ${{ github.sha }}
      APP_PORT: '8080'
      RUN_CONTAINER_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Generate disposable credentials
        run: python3 tools/setup-containers.py
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build application image from this commit
        run: docker compose build --pull app
      - name: Check PHP syntax in the built image
        run: docker run --rm --entrypoint sh "$APP_IMAGE" -c 'find app public config /usr/local/bin/configure-container.php -name "*.php" -print0 | xargs -0 -n1 php -l'
      - name: Check input validation with the image runtime
        run: docker run --rm --entrypoint php --mount "type=bind,src=$PWD,dst=/checks,readonly" "$APP_IMAGE" /checks/tests/validation.php
      - name: Prove a real regression fails its test
        run: python3 tests/verify_gate.py
      - name: Start Apache, PHP and MariaDB
        run: docker compose up -d --no-build --wait --wait-timeout 180
      - name: Test HTTP, database writes and volume persistence
        run: python3 tests/container_smoke.py
      - name: Check cPanel release boundaries
        run: python3 tests/cpanel_release.py
      - name: Package runtime source from the tested commit
        run: python3 tools/package-cpanel.py
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: cpanel-source-${{ github.sha }}
          path: dist/cpanel-release.zip
          retention-days: 7
          if-no-files-found: error
      - name: Save the tested Docker image as evidence
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: docker save "$APP_IMAGE" | gzip > app-image.tar.gz
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: tested-image-${{ github.sha }}
          path: app-image.tar.gz
          retention-days: 7
          if-no-files-found: error
      - name: Capture container status and logs
        if: always()
        run: |
          mkdir -p container-test-results
          docker compose ps -a > container-test-results/status.txt
          docker compose logs --no-color > container-test-results/services.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-test-results-${{ github.sha }}
          path: container-test-results/
          retention-days: 14
      - name: Remove the disposable CI stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  deploy-cpanel:
    needs: container-checks
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.CPANEL_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: cpanel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cpanel-source-${{ github.sha }}
          path: dist
      - name: Deploy tested source to the existing cPanel website
        env:
          CPANEL_FTP_HOST: ${{ vars.CPANEL_FTP_HOST }}
          CPANEL_FTP_PORT: ${{ vars.CPANEL_FTP_PORT }}
          CPANEL_FTP_ROOT: ${{ vars.CPANEL_FTP_ROOT }}
          CPANEL_BASE_URL: ${{ vars.CPANEL_BASE_URL }}
          CPANEL_FTP_USER: ${{ secrets.CPANEL_FTP_USER }}
          CPANEL_FTP_PASSWORD: ${{ secrets.CPANEL_FTP_PASSWORD }}
          APP_REVISION: ${{ github.sha }}
        run: python3 tools/deploy-cpanel.py
